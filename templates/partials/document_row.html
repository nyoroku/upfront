<!-- Document Row for Vault Table -->
<tr class="hover:bg-slate-50/80 transition-colors fade-in" id="doc-{{ doc.pk }}">
    <td class="px-5 py-4">
        <div class="flex items-center gap-4">
            <div
                class="w-10 h-10 rounded-xl bg-brand-50 border border-brand-100 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
            </div>
            <div>
                <p class="text-[14px] font-bold text-slate-900">{{ doc.original_filename|truncatechars:40 }}</p>
                <p class="text-[13px] font-medium text-slate-500 mt-0.5">{{ doc.document_type.name }}</p>
            </div>
        </div>
    </td>
    <td class="px-5 py-4 text-[14px] font-medium text-slate-600">{{ doc.file_size_kb }} KB</td>
    <td class="px-5 py-4">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[11px] font-extrabold uppercase tracking-wide
      {% if doc.verification_status == 'APPROVED' %}bg-brand-50 text-brand-700 border border-brand-200
      {% elif doc.verification_status == 'UPLOADED' %}bg-blue-50 text-blue-700 border border-blue-200
      {% elif doc.verification_status == 'REJECTED' %}bg-red-50 text-red-700 border border-red-200
      {% else %}bg-slate-100 text-slate-600 border border-slate-200{% endif %}">
            {{ doc.get_verification_status_display }}
        </span>
    </td>
    <td class="px-5 py-4 text-[14px] font-medium text-slate-600">{{ doc.created_at|date:"M d, Y" }}</td>
    <td class="px-5 py-4 text-right">
        <button hx-delete="{% url 'vault:document_delete' doc.pk %}" hx-target="#doc-{{ doc.pk }}"
            hx-swap="outerHTML swap:300ms" hx-confirm="Delete {{ doc.original_filename }}?"
            class="p-2.5 rounded-xl text-slate-400 hover:text-red-600 hover:bg-red-50 transition-colors"
            title="Delete Document">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
        </button>
    </td>
</tr>
