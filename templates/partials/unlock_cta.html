<!-- Unlock CTA for locked milestones -->
{% if milestone.template.is_free %}
<div class="mt-3">
    <p class="text-[13px] font-medium text-brand-600 mb-2.5">✨ This step is free — no payment required!</p>
    <button hx-post="{% url 'lanes:milestone_detail' milestone.template.slug %}"
        hx-target="#badge-{{ milestone.template.slug }}" hx-swap="outerHTML"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-500 text-white text-[13px] font-bold hover:bg-brand-600 transition-all shadow-lg shadow-brand-500/25">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
        Start This Step
    </button>
</div>
{% else %}
<div class="mt-3">
    <p class="text-[13px] font-medium text-slate-500 mb-2.5">💳 Payment required to unlock this step.</p>
    <form hx-post="{% url 'payments:payment_initiate' %}" hx-target="#badge-{{ milestone.template.slug }}"
        hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="plan_slug" value="{{ milestone.template.slug }}">
        <button type="submit"
            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#25D366] text-white text-[13px] font-bold hover:bg-[#20b858] transition-all shadow-lg shadow-[#25D366]/25">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
            </svg>
            Pay &amp; Unlock via M-Pesa
        </button>
    </form>
</div>
{% endif %}
