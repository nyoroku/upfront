<!-- Top Bar — Premium -->
<header class="sticky top-0 z-10 transition-all duration-300"
    :class="scrolled ? 'bg-jungle-900/95 backdrop-blur-md border-b border-jungle-700/40' : 'bg-transparent'">
    <div class="flex items-center justify-between px-5 md:px-8 py-4">
        <!-- Hamburger -->
        <button @click="sidebarOpen = !sidebarOpen"
            class="lg:hidden p-2 -ml-2 rounded-xl text-cream-300/60 hover:text-cream-100 hover:bg-jungle-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>

        <!-- Breadcrumb / Title -->
        <div class="hidden lg:block">
            <h2 class="text-[15px] font-medium text-cream-100">{% block page_title %}{% endblock %}</h2>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2">
            {% if user.is_authenticated %}
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                    class="p-2 rounded-xl text-cream-300/50 hover:text-leaf-400 hover:bg-jungle-800 transition-all relative">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                    </svg>
                    <span
                        class="absolute top-1.5 right-1.5 w-2 h-2 bg-leaf-400 rounded-full ring-2 ring-jungle-900"></span>
                </button>
                <div x-show="open" @click.outside="open = false" x-transition x-cloak
                    class="absolute right-0 mt-2 w-72 rounded-2xl bg-jungle-800 border border-jungle-700/60 shadow-2xl py-1 z-50">
                    <div class="px-4 py-3 border-b border-jungle-700/50">
                        <p class="text-sm font-medium text-cream-100">Notifications</p>
                    </div>
                    <div class="px-4 py-8 text-center">
                        <p class="text-sm text-jungle-500">No new notifications</p>
                    </div>
                </div>
            </div>
            <div class="lg:hidden">
                <a href="{% url 'accounts:profile' %}"
                    class="w-8 h-8 rounded-xl bg-jungle-500 flex items-center justify-center text-xs font-bold text-cream-50">
                    {{ user.first_name|default:user.email|truncatechars:1|upper }}
                </a>
            </div>
            {% else %}
            <a href="{% url 'account_login' %}"
                class="px-4 py-2 text-[13px] font-medium text-cream-300/70 hover:text-cream-100 transition-colors">Sign
                In</a>
            <a href="{% url 'account_signup' %}"
                class="px-5 py-2.5 text-[13px] font-semibold bg-leaf-400 text-jungle-950 rounded-xl hover:bg-leaf-300 transition-all shadow-lg shadow-leaf-400/20">Get
                Started</a>
            {% endif %}
        </div>
    </div>
</header>
