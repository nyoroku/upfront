<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="worklaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008060" />
      <stop offset="60%" stop-color="#005540" />
      <stop offset="100%" stop-color="#95BF47" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#003d2d" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect width="100" height="100" rx="32" fill="url(#worklaneGrad)" />
  
  <!-- Shadow behind the U -->
  <path d="M 33 32 L 33 56 C 33 70, 67 70, 67 56 L 67 32" 
        fill="none" 
        stroke="#002D2D" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.15" />
        
  <!-- The U (Upfront) -->
  <path d="M 33 30 L 33 54 C 33 68, 67 68, 67 54 L 67 30" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
