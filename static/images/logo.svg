<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D3D" />
      <stop offset="100%" stop-color="#001515" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Subtle Recovery Pulse Rings -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08" />
  <circle cx="60" cy="60" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08" />
  <path d="M 16 60 H 104" stroke="#FFFFFF" stroke-width="1" opacity="0.08" />
  
  <!-- Sweeping gold recovery line -->
  <path d="M 20 85 Q 40 15 95 35" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Dashed center line -->
  <path d="M 20 85 Q 40 15 95 35" fill="none" stroke="#001515" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round" />

  <!-- Bold "U" for Upfront -->
  <path d="M 40 45 L 40 70 C 40 85, 80 85, 80 70 L 80 45" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Spark of Recovery (Star) -->
  <g transform="translate(95, 35) scale(1.2)">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#FFFFFF" />
  </g>
</svg>